apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web-headless
  namespace: network-policy-demo
spec:
  serviceName: "web-headless"
  replicas: 3
  selector:
    matchLabels:
      app: web-headless
  template:
    metadata:
      labels:
        app: web-headless
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
  volumeClaimTemplates:
    - metadata:
      name: web-headless-pvc
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
