apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: block-forbidden-environment
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - message: "Pods with environment=forbidden are not allowed."
      expression: >-
        !has(object.metadata.labels) ||
        !('environment' in object.metadata.labels) ||
        object.metadata.labels['environment'] != 'forbidden'
