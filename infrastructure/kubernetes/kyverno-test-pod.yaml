apiVersion: v1
kind: Pod
metadata:
  name: kyverno-test-pod
  namespace: security-demo
  labels:
    environment: forbidden
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: busybox:1.36
      command: ["sh", "-c", "echo Hello Kubernetes! && sleep 3600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL