apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: {{ .Values.redis.storage.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.redis.storage.size }}
